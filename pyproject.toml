[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qet_football"
version = "0.1.0"
description = "Match predictor and team balancer for the QET 6v6 football group"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
qet = "qet_football.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
